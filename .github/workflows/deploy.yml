name: Deploy

# ============================================================================
# Docker Build + Private TCR + SSH Deployment
# ============================================================================
# This workflow builds, publishes, and deploys an image for a commit that has
# already passed the protected pull request checks. Runtime health and rollback
# remain part of deployment; repository tests are not repeated here. Tagged
# deployments additionally require a successful Release workflow for the same
# commit before they can publish an image.
#
# Requires the following secrets:
#   - SERVER_HOST:                Target server IP/hostname
#   - SERVER_USER:                SSH user
#   - SSH_PRIVATE_KEY:            SSH private key for authentication
#   - NEXT_PUBLIC_SENTRY_DSN:     Build-time public Sentry DSN
#   - FEEDBACK_FEISHU_GROUP_URL:  Feishu group invitation shown on the About page
#   - TCR_USERNAME:               Tencent Cloud account ID / UIN (organization secret)
#   - TCR_PASSWORD:               TCR registry login password (organization secret)
#
# Runtime secrets, including the database URL, are read from
# /data/sast-people-next/.env on the server. They are not written from GitHub
# Secrets during deployment, except FEEDBACK_FEISHU_GROUP_URL, which this
# workflow syncs from the repository secret when it is configured.
#
# The TCR repository is private. The deployment step logs in with an ephemeral
# Docker config only for the pull, then removes that config before it exits.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      database_backup_ref:
        description: "Optional external production backup/snapshot reference; a local backup is created automatically when omitted"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE_NAME: sast-people-next
  REGISTRY_PREFIX: sast
  TCR_HOST: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: sast
  # 迁移镜像只用这一个固定 tag（每次部署覆盖），不按 commit 打 tag
  MIGRATOR_TAG: migrator
  # TCR 个人版每个仓库上限 100 个 tag：应用镜像只保留最近这么多次部署对应的 tag，
  # 更早的在推送前由 CI 删掉（见 "Prune old image tags from TCR"）
  TAG_RETENTION_COMMITS: "20"

jobs:
  deploy:
    name: Docker Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.ref == 'refs/heads/v3' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Verify tagged release checks
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --json conclusion \
            --jq 'any(.[]; .conclusion == "success")' \
            | grep -qx true; then
            echo "A successful Release workflow is required before deploying tag $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # tag 保留窗口按提交历史算，浅克隆要够深（见 TAG_RETENTION_COMMITS）
          fetch-depth: 50

      - name: Get short Git commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to TCR
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$TCR_PASSWORD" | docker login "$TCR_HOST" --username "$TCR_USERNAME" --password-stdin

      - name: Prune old image tags from TCR
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -uo pipefail
          # 只管清理，绝不因为注册表不给删就把部署拦下来：删不掉的都记到日志/告警里
          REGISTRY="${{ env.TCR_HOST }}"
          # 必须带协议：TCR_HOST 只是域名，少了 https:// 的话 curl 会走 80 端口、拿到 308 重定向页而不是 JSON
          REGISTRY_URL="https://$REGISTRY"
          REPO="${{ env.TCR_NAMESPACE }}/${{ env.SERVICE_NAME }}"
          KEEP="${{ env.TAG_RETENTION_COMMITS }}"
          TMP_DIR="${RUNNER_TEMP:-/tmp}"

          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::runner 上没有 node（解析 JSON 用），跳过 tag 清理"
            exit 0
          fi

          # token 服务地址与 service 名从注册表自己的 401 challenge 里读：TCR 是
          # realm=/service/token、service=token-service（写死 service=registry 会被拒），
          # 而且 scope 要带 push（实测只请求 pull 会 401）。
          challenge=$(curl -sI "$REGISTRY_URL/v2/" | tr -d '\r' | awk 'tolower($1) == "www-authenticate:" { sub(/^[^ ]+[ ]+/, ""); print; exit }')
          realm=$(printf '%s' "$challenge" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
          service=$(printf '%s' "$challenge" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
          case "$realm" in
            https://*) ;;
            "") realm="$REGISTRY_URL/service/token" ;;
            *) realm="https://$realm" ;;
          esac
          [ -n "$service" ] || service=token-service
          token_url="$realm?service=$service&scope=repository:${REPO}:pull,push,delete"

          token_status=$(curl -sS -o "$TMP_DIR/token.json" -w '%{http_code}' \
            -u "$TCR_USERNAME:$TCR_PASSWORD" "$token_url" 2>/dev/null || echo 000)
          TOKEN=$(node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(d.token||d.access_token||"")}catch{}' "$TMP_DIR/token.json" 2>/dev/null || true)
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::拿不到 TCR token（HTTP ${token_status}，${token_url}），跳过 tag 清理（仓库 tag 会继续累积）"
            echo "::group::token 响应（前 400 字节）"
            head -c 400 "$TMP_DIR/token.json" 2>/dev/null || true
            echo ""
            echo "::endgroup::"
            exit 0
          fi

          list_status=$(curl -sS -o "$TMP_DIR/tags.json" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$REGISTRY_URL/v2/$REPO/tags/list" 2>/dev/null || echo 000)
          if [ "$list_status" != "200" ]; then
            echo "::warning::列不出 TCR tag 列表（HTTP ${list_status}），跳过清理"
            head -c 400 "$TMP_DIR/tags.json" 2>/dev/null || true
            exit 0
          fi
          node -e 'const fs=require("fs");try{for(const t of JSON.parse(fs.readFileSync(process.argv[1],"utf8")).tags||[]) console.log(t)}catch{}' \
            "$TMP_DIR/tags.json" > "$TMP_DIR/tags.txt"

          # 保留集合：当前 ref 最近 KEEP 个提交的短 sha（部署 tag 就是它们）+ 本次要推的 tag + 固定 tag。
          # tag 名本身是短 sha、不带时间信息，所以按「还在不在保留集合里」判定，不猜时间顺序。
          {
            git log -n "$KEEP" --format=%h
            echo "${{ steps.vars.outputs.sha_short }}"
            echo "${{ env.MIGRATOR_TAG }}"
          } | sort -u > "$TMP_DIR/keep-tags.txt"

          kept=0
          removed=0
          gone=0
          failed=0

          # 保留窗口里那些 tag 的 digest 也要保护起来：v2 的 DELETE 按 digest 删，
          # 会把指向同一个 manifest 的所有 tag 一起删掉。内容没变的构建（例如只改文档的 commit）
          # 与前一个 commit 共用 digest，只按 tag 名判重就会把窗口内的 tag 一起删掉。
          #
          # 例外：固定 tag migrator 不参与这个保护 —— 它每次部署都会被重新推上来，而历史上那批
          # `<sha>-migrator` 大多与它共用同一个 digest；保护它等于让那些旧 tag 永远删不掉、把 100 个名额一直占着。
          : > "$TMP_DIR/keep-digests.txt"
          while IFS= read -r keep_tag; do
            [ -n "$keep_tag" ] || continue
            [ "$keep_tag" = "${{ env.MIGRATOR_TAG }}" ] && continue
            keep_headers=""
            if ! keep_headers=$(curl -fsI \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
                -H "Accept: application/vnd.oci.image.index.v1+json" \
                "$REGISTRY_URL/v2/$REPO/manifests/$keep_tag"); then
              keep_headers=""
            fi
            keep_digest=$(printf '%s\n' "$keep_headers" \
              | tr -d '\r' \
              | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
            [ -n "$keep_digest" ] && echo "$keep_digest" >> "$TMP_DIR/keep-digests.txt"
          done < "$TMP_DIR/keep-tags.txt"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if grep -qxF -- "$tag" "$TMP_DIR/keep-tags.txt"; then
              kept=$((kept + 1))
              continue
            fi

            # v2 删除要按 digest（tag 名是短 sha，不携带时间信息，所以按「还在不在保留集合里」判定）
            headers=""
            if ! headers=$(curl -fsI \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
                -H "Accept: application/vnd.oci.image.index.v1+json" \
                "$REGISTRY_URL/v2/$REPO/manifests/$tag"); then
              headers=""
            fi
            digest=$(printf '%s\n' "$headers" \
              | tr -d '\r' \
              | awk 'tolower($1) == "docker-content-digest:" { print $2 }')

            if [ -n "$digest" ] && grep -qxF -- "$digest" "$TMP_DIR/keep-digests.txt"; then
              echo "  跳过 $tag（与保留窗口内的镜像共用 digest，删了会连带删掉它）"
              kept=$((kept + 1))
              continue
            fi

            if [ -z "$digest" ]; then
              # 多半是随共用 digest 一起被删掉了（上一个 DELETE 把这些 tag 一并抹掉），也可能是注册表拒绝读
              echo "  跳过 $tag（读不到 manifest）"
              gone=$((gone + 1))
              continue
            fi

            delete_status=$(curl -sS -o "$TMP_DIR/delete.json" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "$REGISTRY_URL/v2/$REPO/manifests/$digest" 2>/dev/null || echo 000)
            case "$delete_status" in
              2*)
                echo "  已删除旧 tag $tag"
                removed=$((removed + 1))
                ;;
              *)
                echo "::warning::删除 $tag 失败（HTTP ${delete_status}）"
                # 80 个 tag 逐个打响应体会淹掉日志：只展开第一个失败的原因
                if [ "$failed" = "0" ]; then
                  echo "::group::第一个删除失败的响应"
                  head -c 300 "$TMP_DIR/delete.json" 2>/dev/null || true
                  echo ""
                  echo "::endgroup::"
                fi
                failed=$((failed + 1))
                ;;
            esac
          done < "$TMP_DIR/tags.txt"

          remaining_status=$(curl -sS -o "$TMP_DIR/tags-after.json" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$REGISTRY_URL/v2/$REPO/tags/list" 2>/dev/null || echo 000)
          remaining=$(node -e 'const fs=require("fs");try{process.stdout.write(String((JSON.parse(fs.readFileSync(process.argv[1],"utf8")).tags||[]).length))}catch{process.stdout.write("")}' "$TMP_DIR/tags-after.json" 2>/dev/null || true)
          [ -n "$remaining" ] || remaining="?"
          echo "TCR tag：删除 ${removed} 个、保留 ${kept} 个、读不到 manifest ${gone} 个、失败 ${failed} 个；现有 ${remaining} 个（HTTP ${remaining_status}，上限 100）"
          # 只在「下一个 tag 一定推不上去」时报错：98/99 还能挤下这次部署，不该拦
          if [ "${remaining:-0}" -ge 100 ] 2>/dev/null; then
            echo "::error::TCR 里仍有 ${remaining} 个 tag（个人版上限 100）。API 删除在这个仓库不生效，请到 TCR 控制台清理或升级套餐。"
            exit 1
          fi

      - name: Build and push image to TCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.TCR_HOST }}/${{ env.TCR_NAMESPACE }}/${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: |
            type=gha,scope=app
            type=gha
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migration image to TCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.TCR_HOST }}/${{ env.TCR_NAMESPACE }}/${{ env.SERVICE_NAME }}:${{ env.MIGRATOR_TAG }}
          cache-from: |
            type=gha,scope=migrator
            type=gha
          cache-to: type=gha,mode=max,scope=migrator

      - name: Log out from TCR
        if: always()
        run: |
          docker logout "$TCR_HOST" || true

      - name: Sync Docker Compose file
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SERVICE_DIR="/data/${{ env.SERVICE_NAME }}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$SERVICE_DIR'"

          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o Compression=no \
            docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:$SERVICE_DIR/"

      - name: Deploy on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          FEEDBACK_FEISHU_GROUP_URL: ${{ secrets.FEEDBACK_FEISHU_GROUP_URL }}
          DATABASE_BACKUP_REF: ${{ inputs.database_backup_ref }}
          MIGRATOR_TAG: ${{ env.MIGRATOR_TAG }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TCR_USERNAME,TCR_PASSWORD,FEEDBACK_FEISHU_GROUP_URL,DATABASE_BACKUP_REF,DEPLOY_RUN_ID,MIGRATOR_TAG
          script: |
            set -e

            SERVICE_DIR="/data/${{ env.SERVICE_NAME }}"
            IMAGE_NAME="${{ env.REGISTRY_PREFIX }}/${{ env.SERVICE_NAME }}"
            TCR_HOST="${{ env.TCR_HOST }}"
            REMOTE_IMAGE="${{ env.TCR_HOST }}/${{ env.TCR_NAMESPACE }}/${{ env.SERVICE_NAME }}"
            NEW_VERSION_TAG="${{ steps.vars.outputs.sha_short }}"

            cd ${SERVICE_DIR}

            echo "=========================================="
            echo "Deploying version: ${NEW_VERSION_TAG}"
            echo "=========================================="

            echo ""
            echo "[1/9] Pulling private images from TCR..."
            DOCKER_CONFIG=$(mktemp -d)
            cleanup_docker_config() {
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup_docker_config EXIT

            printf '%s' "$TCR_PASSWORD" \
              | docker --config "$DOCKER_CONFIG" login "$TCR_HOST" \
                  --username "$TCR_USERNAME" --password-stdin

            for i in 1 2 3; do
              if docker --config "$DOCKER_CONFIG" pull "${REMOTE_IMAGE}:${NEW_VERSION_TAG}"; then
                break
              fi
              echo "  Pull failed (${i}/3); retrying in 10 seconds..."
              sleep 10
            done
            docker image inspect "${REMOTE_IMAGE}:${NEW_VERSION_TAG}" >/dev/null 2>&1 || {
              echo "Image pull failed; aborting deployment."
              exit 1
            }
            docker tag "${REMOTE_IMAGE}:${NEW_VERSION_TAG}" "${IMAGE_NAME}:${NEW_VERSION_TAG}"
            for i in 1 2 3; do
              if docker --config "$DOCKER_CONFIG" pull "${REMOTE_IMAGE}:${MIGRATOR_TAG}"; then
                break
              fi
              echo "  Migration image pull failed (${i}/3); retrying in 10 seconds..."
              sleep 10
            done
            docker image inspect "${REMOTE_IMAGE}:${MIGRATOR_TAG}" >/dev/null 2>&1 || {
              echo "Migration image pull failed; aborting deployment."
              exit 1
            }
            docker tag "${REMOTE_IMAGE}:${MIGRATOR_TAG}" "${IMAGE_NAME}:${MIGRATOR_TAG}"

            echo ""
            echo "[2/9] Checking runtime .env..."
            if [ ! -f .env ]; then
              echo "Missing ${SERVICE_DIR}/.env"
              echo "Create it on the server before deploying. docker-compose.yml reads it through env_file."
              exit 1
            fi
            chmod 600 .env

            if [ -n "${FEEDBACK_FEISHU_GROUP_URL:-}" ]; then
              ENV_FILE_TMP=$(mktemp "${SERVICE_DIR}/.env.XXXXXX")
              awk 'index($0, "FEEDBACK_FEISHU_GROUP_URL=") != 1' .env > "$ENV_FILE_TMP"
              printf '%s\n' "FEEDBACK_FEISHU_GROUP_URL=${FEEDBACK_FEISHU_GROUP_URL}" >> "$ENV_FILE_TMP"
              chmod 600 "$ENV_FILE_TMP"
              mv "$ENV_FILE_TMP" .env
            fi

            echo ""
            EXTERNAL_BACKUP_REF="${DATABASE_BACKUP_REF:-}"
            if [ -n "$EXTERNAL_BACKUP_REF" ]; then
              case "$EXTERNAL_BACKUP_REF" in
                *[!a-zA-Z0-9._-]*)
                  echo "Invalid external database backup reference: ${EXTERNAL_BACKUP_REF}" >&2
                  exit 1
                  ;;
              esac
              echo "External database backup reference: ${EXTERNAL_BACKUP_REF}"
            else
              echo "No external backup reference supplied; using the verified local backup below."
            fi
            LOCAL_BACKUP_REF="local-${NEW_VERSION_TAG}-$(date -u +%Y%m%dT%H%M%SZ)-run-${DEPLOY_RUN_ID:-manual}"
            case "$LOCAL_BACKUP_REF" in
              ""|*[!a-zA-Z0-9._-]*)
                echo "Generated invalid local database backup reference: ${LOCAL_BACKUP_REF}" >&2
                exit 1
                ;;
            esac

            BACKUP_DIR="${SERVICE_DIR}/backups"
            BACKUP_FILE="${LOCAL_BACKUP_REF}.dump"
            BACKUP_RETENTION_DAYS=14
            if [ -e "$BACKUP_DIR" ] && [ ! -d "$BACKUP_DIR" ]; then
              echo "Backup path exists but is not a directory: ${BACKUP_DIR}" >&2
              exit 1
            fi
            mkdir -p "$BACKUP_DIR"
            if ! chmod 700 "$BACKUP_DIR"; then
              echo "Unable to restrict backup directory permissions: ${BACKUP_DIR}" >&2
              exit 1
            fi
            BACKUP_MODE=$(stat -c '%a' "$BACKUP_DIR")
            test "$BACKUP_MODE" = 700 || {
              echo "Backup directory must have mode 700 (found ${BACKUP_MODE}): ${BACKUP_DIR}" >&2
              exit 1
            }
            test -w "$BACKUP_DIR" || {
              echo "Backup directory is not writable by the deployment user: ${BACKUP_DIR}" >&2
              exit 1
            }

            echo ""
            echo "[3/9] Creating database backup (${LOCAL_BACKUP_REF})..."
            docker run --rm \
              --network postgres \
              --env-file .env \
              --user "$(id -u):$(id -g)" \
              -e "BACKUP_FILE=${BACKUP_FILE}" \
              -v "${BACKUP_DIR}:/backup" \
              postgres:16-alpine \
              sh -c 'pg_dump "$DATABASE_MIGRATION_URL" --format=custom --file="/backup/$BACKUP_FILE"'
            test -s "${BACKUP_DIR}/${BACKUP_FILE}"
            docker run --rm \
              --network postgres \
              -e "BACKUP_FILE=${BACKUP_FILE}" \
              -v "${BACKUP_DIR}:/backup:ro" \
              postgres:16-alpine \
              sh -c 'pg_restore --list "/backup/$BACKUP_FILE" >/dev/null'
            echo "Database backup created at ${BACKUP_DIR}/${BACKUP_FILE}"
            echo "Removing local backups older than ${BACKUP_RETENTION_DAYS} days..."
            find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.dump' \
              ! -name "$BACKUP_FILE" -mtime "+${BACKUP_RETENTION_DAYS}" -print -delete

            echo ""
            echo "[4/9] Applying database migrations..."
            if ! docker run --rm \
              --name sast-people-next-migrate \
              --env-file .env \
              --network postgres \
              "${IMAGE_NAME}:${MIGRATOR_TAG}"; then
              echo "Database migration failed; application image was not activated."
              exit 1
            fi

            echo ""
            echo "[5/9] Verifying application database permissions..."
            if ! docker run --rm \
              --name sast-people-next-permission-check \
              --env-file .env \
              --network postgres \
              "${IMAGE_NAME}:${MIGRATOR_TAG}" \
              node scripts/check-db-permissions.mjs; then
              echo "Application database permission check failed; application image was not activated."
              exit 1
            fi

            echo ""
            echo "[6/9] Rotating image tags..."
            if docker image inspect "${IMAGE_NAME}:current" >/dev/null 2>&1; then
              if docker image inspect "${IMAGE_NAME}:backup" >/dev/null 2>&1; then
                echo "  Removing old backup image..."
                docker rmi "${IMAGE_NAME}:backup"
              fi
              echo "  Tagging current as backup..."
              docker tag "${IMAGE_NAME}:current" "${IMAGE_NAME}:backup"
            else
              echo "  First deployment, skipping backup rotation"
            fi

            echo "  Tagging new image (${NEW_VERSION_TAG}) as current..."
            docker tag "${IMAGE_NAME}:${NEW_VERSION_TAG}" "${IMAGE_NAME}:current"

            echo ""
            echo "[7/9] Starting service..."
            docker compose up -d --remove-orphans

            echo ""
            echo "[8/9] Health check (timeout: 120s)..."
            HEALTHY=0
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' sast-people-next 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=1
                echo "  [$i/24] Service is healthy!"
                break
              fi
              echo "  [$i/24] status=$STATUS, waiting 5s..."
              sleep 5
            done

            if [ $HEALTHY -eq 0 ]; then
              echo ""
              echo "=========================================="
              echo "!! HEALTH CHECK FAILED -- ROLLING BACK !!"
              echo "=========================================="
              echo ""
              echo "--- Last 40 lines of container logs ---"
              docker logs --tail 40 sast-people-next || true
              echo "----------------------------------------"
              echo "--- Health check diagnostics ---"
              docker inspect --format='{{json .State.Health}}' sast-people-next 2>/dev/null || echo "(inspect failed)"
              echo ""
              echo "--- Direct health test inside container ---"
              docker exec sast-people-next wget -O /dev/null http://127.0.0.1:3003/health 2>&1 || true
              echo "----------------------------------------"

              if docker image inspect "${IMAGE_NAME}:backup" >/dev/null 2>&1; then
                echo ""
                echo "Rolling back to backup image..."
                docker tag "${IMAGE_NAME}:backup" "${IMAGE_NAME}:current"
                docker compose up -d --remove-orphans

                echo "Waiting for rollback to stabilize..."
                sleep 10
                ROLLBACK_STATUS=$(docker inspect --format='{{.State.Health.Status}}' sast-people-next 2>/dev/null || echo "unknown")
                echo "Rollback health status: $ROLLBACK_STATUS"
              else
                echo "No backup image found -- cannot rollback!"
              fi

              echo ""
              echo "Removing failed image..."
              docker rmi "${IMAGE_NAME}:${NEW_VERSION_TAG}" || true

              echo ""
              echo "DEPLOY FAILED. Rolled back to previous version."
              exit 1
            fi

            echo ""
            echo "[9/9] Cleaning up..."
            docker rmi "${REMOTE_IMAGE}:${NEW_VERSION_TAG}" || true
            docker rmi "${REMOTE_IMAGE}:${MIGRATOR_TAG}" || true
            docker rmi "${IMAGE_NAME}:${MIGRATOR_TAG}" || true

            echo "  Pruning old version images (keep latest 3)..."
            docker image ls --format '{{.Tag}}' "${IMAGE_NAME}" \
              | grep -v -E '^(current|backup|latest|migrator)$' \
              | tail -n +4 \
              | xargs -r -I {} docker rmi "${IMAGE_NAME}:{}"
            docker image prune -f

            echo ""
            echo "=========================================="
            echo "Deploy complete. Running version: ${NEW_VERSION_TAG}"
            echo "=========================================="
